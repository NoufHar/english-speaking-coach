[project]
name = "english-speaking-coach"
version = "1.0.0"
description = "Voice-first English learning agent with custom harness and Fetch MCP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=14,<17", "python-dotenv>=1,<2", "mcp>=1.6,<2", "openai>=1.75,<3", "pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
